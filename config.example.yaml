# UMCode Configuration Example
# All fields shown with defaults and inline comments.
# Copy to ~/.umcode/config.yaml and fill in your values.
# API keys are stored in the macOS Keychain (or ~/.umcode/secrets.json on
# Linux) — add them with `umcode key add`; they are deliberately null here.

# ---------------------------------------------------------------------------
# AI Provider
# ---------------------------------------------------------------------------
llm:
  provider: claude           # claude | openai | gemini
  model: claude-sonnet-4-6  # model ID for the chosen provider
  api_key: null              # set via env UMCODE_LLM_API_KEY or Keychain
  reasoning_effort: null     # low | medium | high  (OpenAI o-series only)

# Models shown in chat are configuration-led. Pools try enabled entries in
# order and continue on quota or rate-limit failures.
models:
  default_complexity: auto
  default_pool: coding
  configured:
    - id: claude-coding
      name: Claude coding
      provider: claude
      model: claude-sonnet-4-6
      enabled: true
    - id: openai-coding
      name: OpenAI coding fallback
      provider: openai
      model: gpt-5.2
      enabled: true
  pools:
    - id: coding
      name: Coding
      strategy: priority
      models: [claude-coding, openai-coding]
      enabled: true

# ---------------------------------------------------------------------------
# Tools
# ---------------------------------------------------------------------------
tools:
  host_sandbox: auto         # auto | off — confine host shell commands (Seatbelt on macOS, bubblewrap on Linux):
                             # writes only inside the project and temp/cache folders, no credential folders,
                             # no network unless the project allows it

  # Named sandboxed directories agents can operate in.
  # Each workspace has an independent ACL. Relative file paths are resolved
  # against the active workspace root. shell.run cwd defaults to it.
  workspaces:
    - name: builds           # referred to by name in prompts ("use my builds workspace")
      path: ~/umcode-workspace
      default: true          # used when user doesn't specify a workspace
      acl:
        read: true
        write: true
        create_files: true
        delete_files: false  # explicit — agents can't rm files here

    - name: downloads
      path: ~/Downloads
      acl:
        read: true
        write: false
        create_files: false
        delete_files: false
        shell: false         # no shell in Downloads

# ---------------------------------------------------------------------------
# Legacy MCP compatibility — prefer installing an MCP server inside a plugin
# Each server is started as a subprocess; its tools become available to agents
# as  mcp_<name>_<tool>  (e.g. mcp_playwright_screenshot).
# Requires the server package to be installed (e.g. via npx or pip).
# ---------------------------------------------------------------------------
mcp_servers: []
