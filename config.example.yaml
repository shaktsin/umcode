# ---------------------------------------------------------------------------
# Legacy skill compatibility — prefer installing skills inside a plugin
# ---------------------------------------------------------------------------

# These paths remain supported by the backend but are not shown separately in
# the desktop Plugins screen.
# Directories scanned for skills at startup (each child dir with SKILL.md loaded)
skill_dirs:
  - ~/projects/skills/skills

# Runtime overrides applied globally to all skills, or per-skill by name
skills:
  defaults:
    node_bin: ~/.nvm/versions/node/v24.3.0/bin  # node binary dir for JS skills
    python_bin: ""           # override python used to create skill venvs
    extra_path: []
    env: {}

  # Per-skill environment variable overrides (keyed by skill name)
  # news:
  #   env:
  #     SERPAPI_API_KEY: your-key-here
  # finance:
  #   env:
  #     SERPAPI_API_KEY: your-key-here

# ---------------------------------------------------------------------------
# Multi-agent orchestration
# ---------------------------------------------------------------------------
agents:
  enabled: true              # route requests through DynamicOrchestrator

  # Path to a Markdown file injected into every agent's system prompt.
  # Edit this to give the bot standing instructions, persona, or domain context.
  context_file: ~/.umcode/AGENT.md

  # Orchestrator uses a strong reasoning model; workers can use a cheaper one.
  # Leave provider/model blank to inherit from the top-level llm block.
  orchestrator:
    provider: claude
    model: claude-opus-4-6
    api_key: null
    reasoning_effort: null
  worker:
    provider: claude
    model: claude-sonnet-4-6
    api_key: null
    reasoning_effort: null

  max_agent_iterations: 15        # tool-call cycles per spawned agent
  max_orchestrator_iterations: 20 # planning cycles for the orchestrator
  tokens_per_minute: 0            # 0 = unlimited; set to your API tier limit

# ---------------------------------------------------------------------------
# Policy
# ---------------------------------------------------------------------------
policy:
  # Command prefixes (word by word, per pipeline segment) refused without asking,
  # e.g. ["git push", "npm publish"]. Destructive commands (sudo, rm -rf /, curl | sh)
  # are always refused. Read-only commands (ls, cat, rg, git status/diff/log, ...) run
  # without asking when their arguments stay inside the project.
  shell_forbid_commands: []

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
storage:
  db_path: ~/.umcode/umcode.db
  vault_dir: ~/.umcode/vault

# ---------------------------------------------------------------------------
# Runtime
# ---------------------------------------------------------------------------
runtime:
  log_dir: ~/.umcode/logs
  ws_host: 127.0.0.1
  ws_port: 8765
  ws_token: null             # auto-generated on first start
  engine_ws_port: 8766       # engine protocol WebSocket (0 = off); used by the Mac app
  socket_path: ~/.umcode/run/engine.sock
